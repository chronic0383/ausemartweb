name: Trigger auto deployment for conlabjclabs

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/conlabjclabs-AutoDeployTrigger-41997c77-1aa7-471b-a425-84cfec23dec1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CONLABJCLABS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONLABJCLABS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONLABJCLABS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.CONLABJCLABS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONLABJCLABS_REGISTRY_PASSWORD }}
          containerAppName: conlabjclabs
          resourceGroup: Testing-Area
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


